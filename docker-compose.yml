services:
  postgres:
    image: postgres:16
    container_name: praca_magisterska_db_container
    environment:
      POSTGRES_DB: praca_magisterska_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 1. SPRING BOOT - Maszyna wirtualna (JVM)
  spring-jvm:
    image: spring-boot-app:0.0.1-SNAPSHOT
    container_name: spring-jvm-container
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/praca_magisterska_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - BPL_JVM_THREAD_COUNT=50
      # --- PRZYWRÓCENIE BEZPIECZNEGO STOSU (1M) I BALANS REGIONÓW DLA 512M CONTENERA ---
      - JAVA_OPTS=-Xss1m -Xms128m -Xmx220m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. SPRING BOOT - Obraz Natywny (GraalVM)
  spring-native:
    image: spring-boot-app-native:latest
    container_name: spring-native-container
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/praca_magisterska_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. QUARKUS - Maszyna wirtualna (JVM)
  quarkus-jvm:
    image: quarkus-app-jvm:latest
    container_name: quarkus-jvm-container
    ports:
      - "8082:8081"
    depends_on:
      - postgres
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/praca_magisterska_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=admin
      # --- POPRAWKA: Zmiana z drop-and-create na update, żeby nie niszczyć bazy ---
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update
      # --- POPRAWKA: Optymalizacja puli połączeń dla bezpiecznego limitu 512M RAM ---
      - QUARKUS_DATASOURCE_JDBC_MAX_SIZE=30
      - QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT=30
      - JAVA_OPTS=-Xss1m -Xms128m -Xmx220m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 4. QUARKUS - Obraz Natywny (GraalVM / Mandrel)
  quarkus-native:
    image: quarkus-app-native:latest
    container_name: quarkus-native-container
    ports:
      - "8083:8081"
    depends_on:
      - postgres
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/praca_magisterska_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=admin
      # --- POPRAWKA: Zmiana z drop-and-create na update ---
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update
      # --- POPRAWKA: Bezpieczna wielkość puli połączeń ---
      - QUARKUS_DATASOURCE_JDBC_MAX_SIZE=30
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  postgres_data: